# /etc/nginx/sites-available/livres  — remplacer MONDOMAINE.COM par votre vrai domaine
server {
    listen 80;
    listen [::]:80;
    server_name MONDOMAINE.COM www.MONDOMAINE.COM;

    client_max_body_size 13m;          # le site accepte 12 Mo d'images par envoi

    # Fichiers statiques servis directement par Nginx (plus rapide que Python)
    location /static/ {
        alias /srv/livres/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# Certbot ajoutera tout seul la partie HTTPS (443) et la redirection.
